spring.application.name=guarderia_Backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/guarderia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sesión HTTP: cookie con nombre propio (para no chocar con la cookie del front), inaccesible desde scripts
# y con vencimiento por inactividad
server.servlet.session.cookie.name=GUARDERIA_BACK
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Importa de forma segura las credenciales desde la carpeta externa no rastreada
spring.config.import=optional:file:entorno/config.properties

spring.jpa.open-in-view=false