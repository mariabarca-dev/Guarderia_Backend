spring.application.name=guarderia_Backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/guarderia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Importa de forma segura las credenciales desde la carpeta externa no rastreada
spring.config.import=optional:file:entorno/config.properties

spring.jpa.open-in-view=false